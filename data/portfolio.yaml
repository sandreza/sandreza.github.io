- id: distribution-response
  group: Research
  category: Research theme
  nav_title: GFDT
  relationship: Response theory | Generative modeling | Inverse problems
  year: 2024–2026
  title: Generalized fluctuation–dissipation theory
  summary: Learning how a system fluctuates provides a way to predict how its statistics respond to forcing—and
    to calibrate the parameters that shape those statistics.
  body:
  - The generalized fluctuation–dissipation theorem (GFDT) connects small perturbations to correlations measured
    in an unperturbed system. Its practical bottleneck is the score, the gradient of the log probability density.
    Our work uses learned scores to estimate response when the underlying statistics are strongly non-Gaussian.
  - The 2024 Physical Review Letters paper establishes this connection using spatial Ornstein–Uhlenbeck, stochastic
    Allen–Cahn, and two-dimensional Navier–Stokes systems. The 2025 PNAS paper extends the target from mean
    response to changes in probability distributions, including variance, asymmetry, and tails. Together they
    show why the response of a mean can leave important changes in variability unseen.
  - The 24-page PRL supplement is a useful starting point for implementing the method. It develops the GFDT
    derivation, including state-dependent perturbations, then works through score corrections, normalization,
    denoising score matching, network architecture and training, and numerical PDE solvers. Its validation
    examples also explain how response estimates can fail when the learned score is evaluated outside the training
    distribution.
  - 'The parameter-calibration preprint brings GFDT to an inverse problem: adjusting drift and diffusion parameters
    to match observed long-time statistics. The April 2026 revision derives statistical Jacobians from time-correlation
    integrals along baseline dynamics and tests calibration through stochastic Lorenz–96 examples. This offers
    sensitivities without separate perturbation ensembles or an adjoint model, within the assumptions of linear
    response.'
  - Related work develops the tools and scope of the approach. KGMM estimates scores using clustered Gaussian
    mixtures; the cyclo-stationary preprint builds score-based reduced models for periodically varying statistics,
    including the seasonal cycle. Our framework for Earth system model emulation examines how response methods
    interact with memory, hidden variables, noise, and nonlinearity.
  - 'Across these papers, the technical thread is the same: connect a statistical identity to an estimator
    that can be implemented, benchmarked, and used for prediction. Theory, score estimation, stochastic dynamics,
    and numerical validation all have to agree.'
  tags:
  - GFDT
  - Score estimation
  - Statistical sensitivity
  - Inverse problems
  - Stochastic dynamics
  links:
  - label: Response Theory via Generative Score Modeling
    source: Physical Review Letters | 2024
    description: The connection between learned scores and response functions.
    url: https://doi.org/10.1103/PhysRevLett.133.267302
    primary: true
  - label: Download the 2024 PRL supplementary material
    source: Supplement | 24-page PDF
    description: Derivations, score corrections, training details, numerical methods, and validation.
    url: /files/response_prl_supplement.pdf
  - label: Predicting forced responses of probability distributions via the fluctuation-dissipation theorem
      and generative modeling
    source: Proceedings of the National Academy of Sciences | 2025
    description: Extending response estimates to full distributions and their higher moments.
    url: https://doi.org/10.1073/pnas.2509578122
  - label: Read the parameter-calibration preprint
    source: arXiv | v2 · April 1, 2026
