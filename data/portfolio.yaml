stories:
- id: ai-physics
  group: Industry
  category: Industry
  nav_title: AI Physics
  relationship: Rescale | Scientific machine learning
  year: 2025–present
  title: 'AI Physics: from simulation data to engineering tools'
  summary: Turning expensive physics simulations into fast, useful models requires scientific judgment, scalable
    computation, and software that engineers can trust.
  body:
  - AI Physics brings machine learning into the modeling and simulation workflow. Surrogate models learn relationships
    among geometry, boundary conditions, material properties, and physical fields, allowing engineers to explore
    more designs before committing to expensive simulations or experiments.
  - 'My work at Rescale spans model selection, training, validation, inference, visualization, and product
    integration for industrial simulation data. The technical challenge runs through the whole process: representing
    meshes and fields, using GPU resources efficiently, choosing meaningful evaluation cases, and making predictions
    useful in an engineering workflow.'
  - A model needs to be judged against the decisions it supports. That means checking field structure and engineering
    quantities, testing on held-out geometries and operating conditions, and understanding where the training
    data provide enough coverage. Fast inference becomes valuable when its accuracy and limitations are clear.
  - Rescale’s AI Physics software is a concrete realization of this approach, connecting simulation datasets,
    model training and evaluation, versioning, deployment, and inference. The McLaren and General Motors examples
    show how these ideas fit into broader product-development workflows.
  tags:
  - Scientific ML
  - Surrogate models
  - GPU / HPC
  - Validation
  - Product engineering
  links:
