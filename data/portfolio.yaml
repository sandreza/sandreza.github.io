    year: "2019-2025"
    title: "Climate models, open tools, and scientific visualization"
    summary: "Collaborative climate research paired mathematical modeling and open scientific software with interactive ways to explore high-dimensional simulation output."
    body:
      - "At MIT, I worked across Bringing Computation to the Climate Challenge (BC3) and the Climate Modeling Alliance on climate-model emulation, uncertainty quantification, and computational fluid dynamics."
      - "This work included Julia-based workflows for exploring and communicating atmospheric simulations. Makie’s official site credits the GLMakie visualization below from the dry-atmosphere study to A. N. Souza."
      - "The adjacent interactive dashboard shows a volume rendering together with adjustable slices and distribution summaries from the same broader visualization workflow."
