- id: statistical-nonlocality
  group: Research
  category: Research theme
  nav_title: Statistical fluid mechanics
  relationship: Turbulent transport | State-space models | Transfer operators
  year: 2023–2026
  title: Statistical fluid mechanics
  summary: Representing fluid dynamics through distributions, correlations, and transport operators makes statistical
    structure a direct modeling target.
  body:
  - Turbulent flows quickly lose predictability at the level of individual trajectories, yet their distributions
    and transport statistics can remain reproducible. My approach treats those statistics as objects to model
    directly, connecting fluid mechanics with stochastic processes and operator methods.
  - The two papers on statistical nonlocality ask how unresolved motion transports a passive scalar. The 2023
    study constructs an effective-diffusivity operator for stochastically switching coherent flows; the 2024
    follow-up describes turbulent fluxes as a functional of mean gradients across space and time. This identifies
    when a local diffusivity is a reasonable approximation and when spatial coupling or memory matters. The
    first paper was highlighted in the Journal of Fluid Mechanics Focus on Fluids commentary, “Ineffective
    diffusivity.”
  - 'The two Partitions of State Space papers take a complementary route: discretize the evolution of probability
    over flow states. Part 1 builds a data-driven finite-volume approximation to the Liouville or Fokker–Planck
    generator, including uncertainty from finite samples. Part 2 applies it to the rotating, compressible Euler
    equations on a sphere, recovering selected distributions and autocorrelations and exposing global Koopman
    modes.'
  - The modified bisecting K-means work supplies a practical way to build and refine those partitions. Recursive
    clustering creates a hierarchy of data-informed cells while controlling sampling across clusters; observed
    transitions then define a transfer-operator approximation. Tests on Lorenz and Kuramoto–Sivashinsky dynamics
    measure how invariant statistics, modes, and correlations change with resolution.
  - 'Reduced Markovian Models explores a further step: grouping states to retain dynamics at chosen timescales.
    Together, these methods connect interpretable state-space geometry, scalable estimation, and fluid-mechanical
    observables, with explicit checks of what a reduced model preserves.'
  tags:
  - Fluid mechanics
  - Nonlocal closure
  - Transfer operators
  - Markov models
  - Bisecting K-means
  links:
  - label: Statistical Nonlocality of Dynamically Coherent Structures
    source: Journal of Fluid Mechanics | 2023
    description: An operator description of transport by dynamically coherent structures.
    url: https://doi.org/10.1017/jfm.2023.467
    primary: true
  - label: On the non-local nature of turbulent fluxes of passive scalars
    source: Journal of Fluid Mechanics | 2024
    description: Spatial and temporal nonlocality in passive-scalar fluxes.
    url: https://doi.org/10.1017/jfm.2024.302
