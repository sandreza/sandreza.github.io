  year: 2025–2026
  title: Probabilistic inference from available information
  summary: Modeling ρ(y | x) makes the available information—and the uncertainty that remains—part of the prediction.
  body:
  - 'A deterministic model y = f(x) returns one answer for each input. Many scientific problems admit several
    outcomes consistent with the same information: a warming level supports many possible climate realizations,
    and surface observations leave parts of the ocean interior unresolved. A conditional distribution ρ(y |
    x) describes those possibilities and their relative likelihoods.'
  - With Shahine Bouabid and Raffaele Ferrari, I developed score-based generative emulation of impact-relevant
    Earth system model outputs. The model generates monthly temperature, precipitation, humidity, and wind
    fields conditioned on warming information. Modeling them jointly lets us evaluate spatial structure, cross-variable
    dependence, tails, and forced changes across three parent climate models.
  - Surface to Seafloor applies the same probabilistic perspective to ocean state estimation. In an idealized
    double-gyre simulation, a diffusion model infers three-dimensional velocity and buoyancy fields from surface
    information. Ensembles represent possible interiors, and the experiments show how inference skill changes
    with depth and the resolution of the surface data.
  - The central question is what the available information actually constrains. Evaluation therefore goes beyond
    the error of an ensemble mean to examine variability, correlations, and uncertainty. The climate-emulation
    study identifies failures under strong seasonal regime shifts, while Surface to Seafloor makes the loss
    of information with depth explicit.
  - These projects bring together conditional modeling, score-based diffusion, physical data representations,
    and statistical evaluation. They turn incomplete information into ensembles that can be interrogated for
    both scientific quantities and the uncertainty surrounding them.
  tags:
  - Conditional inference
  - Score-based diffusion
  - Joint distributions
  - State estimation
  - Uncertainty
