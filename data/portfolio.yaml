- id: climate-visualization
  group: Research
  category: Research theme
  nav_title: Climate modeling
  relationship: Oceananigans | MIT | Climate Modeling Alliance
  year: 2020–2026
  title: Climate modeling on GPUs
  summary: Climate simulation brings together numerical methods, physical parameterizations, and high-performance
    software—from turbulent mixing to ocean circulation.
  body:
  - At MIT and the Climate Modeling Alliance, I worked on computational fluid dynamics, ocean parameterizations,
    and uncertainty quantification. Oceananigans connects these areas through Julia software that runs fluid
    simulations on GPUs, with an interface designed for both experimentation and large-scale computation.
  - The Oceananigans papers span the original GPU modeling framework, a WENO-based momentum-advection scheme,
    and a dynamical core for routine mesoscale-resolving ocean simulations. The high-level interface preprint
    explains how simple finite-volume numerics, GPU performance, and programmable model configurations work
    together across scales. The HPC challenge is to make physically useful resolution affordable while retaining
    a codebase that scientists can extend.
  - Performance and model fidelity have to be developed together. Advection methods influence numerical mixing,
    while unresolved turbulence requires closures that behave sensibly across forcing conditions and resolutions.
    The KPP uncertainty-quantification study examines calibration and parameter uncertainty for penetrative
    convection; CATKE develops a calibrated one-equation mixing model; NORi combines a physical foundation
    with learned corrections for missing boundary-layer processes.
  - 'The atmospheric work uses a flux-differencing discontinuous Galerkin method for a fully compressible dry
    atmosphere. The visualizations below come from that research: interactive volume renderings, slices, and
    statistical profiles make high-dimensional output easier to inspect and help connect numerical behavior
    with physical interpretation.'
  - This work combines numerical analysis, GPU/HPC workflows, physical modeling, calibration, and scientific
    visualization. The goal is a simulation tool that is fast enough to explore, accurate enough to learn from,
    and transparent enough to improve.
  tags:
  - Climate modeling
  - GPU / HPC
  - Julia
  - Numerical PDEs
  - Ocean mixing
  - Uncertainty quantification
  links:
