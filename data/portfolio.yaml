  - id: "distribution-response"
    number: "03"
    category: "Research note"
    nav_title: "Distribution shifts"
    relationship: "Physical Review Letters → PNAS"
    year: "2024-2025"
    title: "From Mean Response to Distribution Shifts"
    summary: "Two papers connect fluctuation-dissipation theory with score-based generative modeling, first for mean response and then for changes across an entire probability distribution."
    body:
      - "The fluctuation-dissipation theorem relates a system’s unperturbed behavior to its response under a small perturbation. Its practical obstacle is the score function—the gradient of the system’s log probability density. In our Physical Review Letters paper, we learned that score from data and recovered response functions in Gaussian, modified Allen-Cahn, and Navier-Stokes examples."
      - "Those estimates agreed with responses measured from directly perturbed simulations, while also exposing an important limit: a learned score is reliable on states represented by its training distribution and should not be assumed accurate far outside it."
      - "The PNAS follow-up extends the framework beyond the mean to changes in variance, skewness, kurtosis, and distribution tails. For lower-dimensional systems we estimate the score with KGMM; for a high-dimensional two-dimensional Navier-Stokes flow we use a U-Net."
      - "In both settings, the generative approach improves substantially on the usual Gaussian approximation when the response is strongly non-Gaussian. For climate applications, that matters because forcing can change variability and extremes even when a mean shift tells only part of the story."
    tags: ["Generative modeling", "Response theory", "Distribution shifts", "Climate extremes"]
    media:
      - type: "image"
        src: "/media/stories/response-prl.png"
        alt: "Response estimates for three stochastic systems comparing generative, analytical, Gaussian, and directly simulated results"
        caption: "Mean-response estimates from the Physical Review Letters study"
      - type: "image"
        src: "/media/stories/distribution-shifts.png"
        alt: "Predicted changes in a probability density and its moments under forcing"
        caption: "Distribution-response results from the PNAS study"
    links:
      - label: "Read the PNAS article"
        source: "Proceedings of the National Academy of Sciences"
        description: "Predicting forced responses of full probability distributions."
        url: "https://doi.org/10.1073/pnas.2509578122"
        primary: true
      - label: "Open the paper PDF"
        source: "PDF"
        description: "A direct copy of the article."
        url: "/files/higher_response.pdf"
      - label: "Read the earlier Physical Review Letters article"
        source: "Physical Review Letters"
        description: "The mean-response result that this work extends."
        url: "https://doi.org/10.1103/PhysRevLett.133.267302"
      - label: "Open the earlier paper PDF"
        source: "PDF"
        description: "A direct copy of the Physical Review Letters article."
        url: "/files/response_prl.pdf"
  - id: "statistical-nonlocality"
    number: "04"
    category: "Research note"
    nav_title: "Statistical nonlocality"
    relationship: "Journal of Fluid Mechanics | Focus on Fluids"
    year: "2023"
    title: "Statistical Nonlocality and Ineffective Diffusivity"
    summary: "Our paper on nonlocal passive-scalar transport was selected for a Focus on Fluids commentary in the Journal of Fluid Mechanics."
    body:
      - "A central problem in passive-scalar transport is how to represent unresolved flow fluctuations. A local effective diffusivity is a common choice, but many proposed closures connect the advective flux only to gradients of the mean concentration."
      - "We introduced a stochastic framework that replaces local effective diffusivity with an exact effective-diffusivity operator. Computing that operator in several examples quantifies departures from the local approximation and points toward improved closure models."
      - "The accompanying Focus on Fluids article, Ineffective Diffusivity, places the result in the broader history of turbulent-transport parametrization."
    tags: ["Turbulence", "Nonlocal transport", "Closure modeling", "Fluid mechanics"]
    media:
      - type: "image"
        src: "/media/stories/statistical-nonlocality.jpg"
        alt: "Side-by-side empirical and equation-derived transport structures with streamfunction and source fields"
        caption: "Empirical and equation-derived transport structures from the Statistical Nonlocality study"
    links:
      - label: "Read the Journal of Fluid Mechanics article"
        source: "Journal of Fluid Mechanics"
        description: "The peer-reviewed article on statistical nonlocality and coherent structures."
        url: "https://doi.org/10.1017/jfm.2023.467"
        primary: true
      - label: "Read the Focus on Fluids commentary"
        source: "Journal of Fluid Mechanics"
        description: "Ineffective Diffusivity, a commentary highlighting the paper."
        url: "https://www.cambridge.org/core/journals/journal-of-fluid-mechanics/article/ineffective-diffusivity/39DECD8500BBA78F6EFCA769E9C79112"
      - label: "Open the paper PDF"
        source: "PDF"
        description: "A direct copy of the article."
        url: "/files/statistical-non-locality-of-dynamically-coherent-structures.pdf"
  - id: "climate-visualization"
    number: "05"
    category: "Research and software"
    nav_title: "Climate models + visualization"
